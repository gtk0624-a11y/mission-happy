<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😊 행복 단원 미션 보드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&display=swap');

  :root {
    --sun: #FFB300;
    --sun-lt: #FFF8E1;
    --sky: #29B6F6;
    --sky-lt: #E1F5FE;
    --green: #66BB6A;
    --green-lt: #E8F5E9;
    --coral: #EF5350;
    --coral-lt: #FFEBEE;
    --purple: #7E57C2;
    --purple-lt: #EDE7F6;
    --teal: #26A69A;
    --teal-lt: #E0F2F1;
    --navy: #1A237E;
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --shadow: 0 4px 16px rgba(0,0,0,.10);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: linear-gradient(135deg, #FFF8E1 0%, #E3F2FD 50%, #F3E5F5 100%);
    min-height: 100vh;
    padding: 16px;
  }

  /* ── 헤더 ── */
  .hdr {
    text-align: center;
    margin-bottom: 20px;
    padding: 20px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .hdr::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, #FFB30015, #29B6F615, #7E57C215);
  }
  .hdr h1 {
    font-size: 26px; font-weight: 800; color: var(--navy);
    position: relative; margin-bottom: 6px;
  }
  .hdr p { font-size: 14px; color: #888; position: relative; }

  /* ── 범례 ── */
  .legend {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 16px;
  }
  .leg-item {
    display: flex; align-items: center; gap: 6px;
    background: #fff; border-radius: 99px; padding: 5px 14px;
    font-size: 13px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.07);
  }
  .leg-dot { width: 12px; height: 12px; border-radius: 50%; }

  /* ── 컨트롤 바 ── */
  .ctrl-bar {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 16px; align-items: center; justify-content: center;
  }
  .btn {
    padding: 9px 18px; border: none; border-radius: 12px;
    font-family: 'Nanum Gothic', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: transform .1s, box-shadow .1s;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .btn:active { transform: scale(.95); }
  .btn-random { background: var(--sun); color: #333; }
  .btn-edit   { background: var(--navy); color: #fff; }
  .btn-reset  { background: #ECEFF1; color: #555; }

  /* ── 타이머 ── */
  .timer-wrap {
    background: var(--card); border-radius: var(--radius);
    padding: 14px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .timer-disp {
    font-size: 36px; font-weight: 800; color: var(--navy);
    font-variant-numeric: tabular-nums; min-width: 100px; text-align: center;
    letter-spacing: 2px;
  }
  .timer-disp.warn   { color: #E65100; animation: blink 1s infinite; }
  .timer-disp.danger { color: var(--coral); animation: blink .4s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset {
    padding: 6px 14px; border: 2px solid #ddd; border-radius: 10px;
    background: #fff; cursor: pointer; font-size: 13px; font-weight: 700;
    font-family: 'Nanum Gothic', sans-serif; color: #555;
    transition: all .15s;
  }
  .preset.sel { border-color: var(--navy); background: var(--navy); color: #fff; }
  .t-btns { display: flex; gap: 8px; }
  .t-go  { background: var(--green); color: #fff; }
  .t-stp { background: var(--coral); color: #fff; }
  .t-rst { background: #ECEFF1; color: #555; }
  .prog-wrap {
    flex: 1; background: #EEE; border-radius: 99px; height: 10px;
    overflow: hidden; min-width: 100px;
  }
  .prog-bar {
    height: 100%; background: var(--navy); border-radius: 99px;
    transition: width .5s linear, background .3s;
  }

  /* ── 점수판 ── */
  .score-section {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .score-section h3 { font-size: 15px; color: var(--navy); margin-bottom: 12px; font-weight: 800; }
  .score-meta {
    display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .s-box {
    flex: 1; background: #F5F5F5; border-radius: 12px;
    padding: 10px; text-align: center; min-width: 80px;
  }
  .s-box .lbl { font-size: 11px; color: #999; margin-bottom: 4px; }
  .s-box .val { font-size: 22px; font-weight: 800; color: var(--navy); }
  .team-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .team-card {
    position: relative; background: #F5F5F5; border-radius: 14px;
    padding: 12px 14px 12px 14px; min-width: 100px; text-align: center;
    cursor: pointer; border: 2.5px solid transparent; transition: all .15s;
    box-shadow: 0 2px 6px rgba(0,0,0,.07);
  }
  .team-card.active { border-color: var(--navy); background: #E8EAF6; }
  .team-name { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .team-score { font-size: 26px; font-weight: 800; color: #333; }
  .team-btns { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
  .tc-btn {
    width: 28px; height: 28px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 16px; font-weight: 700; font-family: 'Nanum Gothic';
    display: flex; align-items: center; justify-content: center; transition: transform .1s;
  }
  .tc-btn:active { transform: scale(.9); }
  .tc-plus  { background: #E8F5E9; color: #2E7D32; }
  .tc-minus { background: #FFEBEE; color: #C62828; }
  .tc-del   {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px;
    background: rgba(0,0,0,.06); border: none; border-radius: 50%;
    cursor: pointer; font-size: 10px; color: #bbb;
    display: flex; align-items: center; justify-content: center;
  }
  .tc-del:hover { background: #FFCDD2; color: #C62828; }
  .score-ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ── 미션 그리드 ── */
  .section-label {
    font-size: 15px; font-weight: 800; color: var(--navy);
    margin: 16px 0 8px 4px; display: flex; align-items: center; gap: 8px;
  }
  .section-label span {
    padding: 3px 14px; border-radius: 99px; font-size: 12px; color: #fff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px; margin-bottom: 16px;
  }
  .gBtn {
    border: 2.5px solid #E0E0E0; border-radius: var(--radius);
    padding: 14px 4px; text-align: center; cursor: pointer;
    background: #fff; transition: all .15s;
    box-shadow: 0 2px 6px rgba(0,0,0,.07);
  }
  .gBtn:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.14); }
  .gBtn.done  { opacity: .45; filter: grayscale(.5); }
  .gBtn .n    { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
  .gBtn .v    { display: block; font-size: 12px; font-weight: 700; color: #333; }

  /* ── 모달 ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.55); z-index: 100;
    align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 24px;
    padding: 28px; max-width: 460px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); position: relative;
    animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    background: #F5F5F5; border: none; border-radius: 50%;
    width: 34px; height: 34px; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #777;
  }
  .modal-num  { font-size: 13px; color: #aaa; margin-bottom: 6px; }
  .modal-tag  {
    display: inline-block; padding: 5px 16px; border-radius: 99px;
    font-size: 18px; font-weight: 800; margin-bottom: 10px; color: #fff;
  }
  .modal-category {
    font-size: 12px; color: #999; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .cat-badge {
    padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 700;
    color: #fff;
  }
  .modal-mission {
    font-size: 16px; line-height: 1.8; color: #333;
    background: #F8F8F8; border-radius: 14px; padding: 16px;
    margin-bottom: 14px; border-left: 5px solid var(--navy);
    white-space: pre-wrap;
  }
  .modal-hint {
    font-size: 13px; color: #888; background: #FFFDE7;
    border-radius: 10px; padding: 10px 14px; margin-bottom: 18px;
    border-left: 4px solid #FFB300;
  }
  .modal-btns { display: flex; gap: 10px; }
  .m-done { background: var(--green); color: #fff; flex: 1; padding: 13px; border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: 'Nanum Gothic'; }
  .m-close-btn { background: #ECEFF1; color: #555; flex: 0 0 auto; padding: 13px 18px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Nanum Gothic'; }

  /* ── 편집 패널 ── */
  .edit-panel {
    display: none; background: #fff; border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .edit-panel.show { display: block; }
  .edit-panel h3 { font-size: 16px; color: var(--navy); margin-bottom: 14px; font-weight: 800; }
  .edit-card {
    background: #F8F8F8; border-radius: 12px; padding: 14px;
    margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .edit-num { font-size: 20px; font-weight: 800; color: var(--navy); min-width: 32px; padding-top: 6px; }
  .edit-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .edit-fields input, .edit-fields textarea {
    width: 100%; border: 1.5px solid #DDD; border-radius: 10px;
    padding: 8px 12px; font-family: 'Nanum Gothic'; font-size: 14px; color: #333;
    background: #fff;
  }
  .edit-fields textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
  .edit-actions { display: flex; gap: 8px; margin-top: 14px; }
  .e-save { background: var(--navy); color: #fff; }
  .e-cancel { background: #ECEFF1; color: #555; }
  .e-dl { background: var(--green); color: #fff; }
  .e-add { background: var(--sun); color: #333; font-size: 13px; padding: 8px 14px; margin-bottom: 14px; }

  /* 랜덤 결과 */
  .random-result {
    background: var(--sun-lt); border: 2.5px solid var(--sun);
    border-radius: 14px; padding: 14px 18px; margin-bottom: 14px;
    text-align: center; display: none;
  }
  .random-result.show { display: block; }
  .rr-label { font-size: 13px; color: #888; margin-bottom: 4px; }
  .rr-num { font-size: 32px; font-weight: 800; color: var(--navy); }
  .rr-value { font-size: 18px; font-weight: 700; color: var(--sun); }

  /* ── 역전 타임 ── */
  .btn-reversal {
    background: linear-gradient(135deg, #FF1744, #FF6D00);
    color: #fff; font-size: 15px; letter-spacing: 1px;
    animation: pulse-red 1.5s infinite;
    border: none;
  }
  @keyframes pulse-red {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,23,68,.5); }
    50%      { box-shadow: 0 0 0 10px rgba(255,23,68,0); }
  }
  .reversal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.85);
    align-items: center; justify-content: center; flex-direction: column;
  }
  .reversal-overlay.show { display: flex; }
  .reversal-title {
    font-size: 28px; font-weight: 800; color: #FF1744;
    letter-spacing: 4px; margin-bottom: 16px;
    animation: flicker 0.8s infinite alternate;
  }
  @keyframes flicker {
    from { opacity: 1; text-shadow: 0 0 10px #FF1744, 0 0 30px #FF6D00; }
    to   { opacity: .7; text-shadow: 0 0 4px #FF1744; }
  }
  .reversal-timer {
    font-size: 100px; font-weight: 800; color: #fff;
    font-variant-numeric: tabular-nums; line-height: 1;
    letter-spacing: 4px; margin-bottom: 20px;
  }
  .reversal-timer.danger { color: #FF1744; animation: blink .3s infinite; }
  .reversal-prog-wrap {
    width: 320px; background: rgba(255,255,255,.2);
    border-radius: 99px; height: 12px; overflow: hidden; margin-bottom: 28px;
  }
  .reversal-prog-bar {
    height: 100%; background: #FF1744; border-radius: 99px;
    transition: width .5s linear;
  }
  .btn-reversal-stop {
    padding: 12px 32px; background: #fff; color: #FF1744;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 800;
    font-family: 'Nanum Gothic'; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }

  /* 저작권 */
  .copyright {
    text-align: center; font-size: 14px; color: #333; font-weight: 800; margin-top: 20px; padding-bottom: 10px;
  }

  @media(max-width:480px){
    .grid { grid-template-columns: repeat(3,1fr); }
    .hdr h1 { font-size: 20px; }
  }
</style>
</head>

// ── 그리드 렌더 ──────────────────────────────────
function renderGrid() {
  const mA = missions.filter(m => m.category === 'A');
  const mB = missions.filter(m => m.category === 'B');

  function buildGrid(arr, containerId) {
    const g = document.getElementById(containerId);
    g.innerHTML = '';
    arr.forEach(m => {
      const b = document.createElement('button');
      b.className = 'gBtn' + (done.has(m.num) ? ' done' : '');
      b.id = 'gb' + m.num;
      b.style.borderColor = done.has(m.num) ? '#DDD' : m.color;
      b.style.background  = done.has(m.num) ? '#F5F5F5' : m.bg;
      b.innerHTML = `<span class="v" style="font-size:20px;font-weight:800;color:#333;">${done.has(m.num)?'✅':m.num}</span>`;
      b.onclick = () => openModal(m.num);
      g.appendChild(b);
    });
  }
  const mC = missions.filter(m => m.category === 'C');
  buildGrid(mA, 'gridA');
  buildGrid(mB, 'gridB');
  buildGrid(mC, 'gridC');

  document.getElementById('totalCnt').textContent = missions.length;
  updateCounts();
}

function updateCounts() {
  document.getElementById('doneCnt').textContent = done.size;
  document.getElementById('leftCnt').textContent = missions.length - done.size;
}

// ── 모달 ──────────────────────────────────
function openModal(num) {
  current = num;
  const m = missions.find(x => x.num === num);
  const isDone = done.has(num);

  document.getElementById('mNum').textContent = `🎲 ${num}번 미션`;

  const tag = document.getElementById('mTag');
  tag.textContent = m.value;
  tag.style.background = m.color;

  const catColors = { '심리':'#FF7043', '사회':'#1E88E5', '윤리':'#43A047', '목적':'#8E24AA' };
  const catLabels = { '심리':'심리적 관점', '사회':'사회적 관점', '윤리':'윤리적 관점', '목적':'삶의 목적과 행복' };
  const catDiv = document.getElementById('mCat');
  catDiv.innerHTML = `<span class="cat-badge" style="background:${catColors[m.type]}">${catLabels[m.type]}</span>`;

  document.getElementById('mMission').textContent = m.mission;
  document.getElementById('mHint').textContent = '💡 ' + m.hint;

  const doneBtn = document.querySelector('.m-done');
  if (isDone) {
    doneBtn.textContent = '↩️ 완료 취소';
    doneBtn.style.background = '#90A4AE';
  } else {
    doneBtn.textContent = '✅ 미션 완료!';
    doneBtn.style.background = '#66BB6A';
  }
  document.getElementById('overlay').classList.add('show');
}
function closeModal(e) {
  if (e.target.id === 'overlay') closeModalBtn();
}
function closeModalBtn() {
  document.getElementById('overlay').classList.remove('show');
  current = null;
}
function markDone() {
  if (current === null) return;
  if (done.has(current)) {
    done.delete(current);
  } else {
    done.add(current);
    if (activeIdx !== null && teams[activeIdx]) {
      teams[activeIdx].score++;
      renderTeams();
    }
  }
  renderGrid();
  closeModalBtn();
}

// ── 랜덤 ──────────────────────────────────
function doRandom() {
  const remaining = missions.filter(m => !done.has(m.num));
  const pool = remaining.length > 0 ? remaining : missions;
  const m = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('rrNum').textContent = m.num + '번';
  document.getElementById('rrVal').textContent = m.value;
  const rr = document.getElementById('randomResult');
  rr.classList.add('show');
  setTimeout(() => openModal(m.num), 400);
}

// ── 타이머 ──────────────────────────────────
function setPreset(sec, el) {
  document.querySelectorAll('.preset').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  tTotal = sec; tLeft = sec; tRun = false;
  clearInterval(tIv);
  renderTimer();
}
function startTimer() {
  if (tRun) return;
  tRun = true;
  tIv = setInterval(() => {
    if (tLeft <= 0) { clearInterval(tIv); tRun = false; renderTimer(); return; }
    tLeft--;
    renderTimer();
  }, 1000);
}
function stopTimer()  { clearInterval(tIv); tRun = false; }
function resetTimer() { clearInterval(tIv); tRun = false; tLeft = tTotal; renderTimer(); }
function renderTimer() {
  const m = String(Math.floor(tLeft/60)).padStart(2,'0');
  const s = String(tLeft%60).padStart(2,'0');
  const d = document.getElementById('timerDisp');
  d.textContent = `${m}:${s}`;
  d.className = 'timer-disp' + (tLeft<=10?' danger':tLeft<=20?' warn':'');
  const pct = tTotal > 0 ? (tLeft/tTotal)*100 : 0;
  const pb = document.getElementById('progBar');
  pb.style.width = pct + '%';
  pb.style.background = tLeft<=10?'#C62828':tLeft<=20?'#E65100':'#1A237E';
}

// ── 팀 점수판 ──────────────────────────────────
function addTeam() {
  const name = prompt('팀 이름을 입력하세요', `${teams.length+1}팀`);
  if (!name) return;
  teams.push({ name, score: 0 });
  renderTeams();
}
function renderTeams() {
  const row = document.getElementById('teamRow');
  row.innerHTML = '';
  teams.forEach((t, i) => {
    const c = document.createElement('div');
    c.className = 'team-card' + (i === activeIdx ? ' active' : '');
    c.innerHTML = `
      <button class="tc-del" onclick="delTeam(${i})">✕</button>
      <div class="team-name" ondblclick="renameTeam(${i})">${t.name}</div>
      <div class="team-score">${t.score}</div>
      <div class="team-btns">
        <button class="tc-btn tc-plus"  onclick="adjScore(${i},1)">＋</button>
        <button class="tc-btn tc-minus" onclick="adjScore(${i},-1)">－</button>
      </div>`;
    c.onclick = (e) => { if(!['tc-del','tc-plus','tc-minus'].some(cls=>e.target.classList.contains(cls))) setActive(i); };
    row.appendChild(c);
  });
}
function setActive(i) { activeIdx = (activeIdx===i) ? null : i; renderTeams(); }
function adjScore(i, d) { teams[i].score = Math.max(0, teams[i].score + d); renderTeams(); }
function delTeam(i) { teams.splice(i,1); if(activeIdx===i) activeIdx=null; renderTeams(); }
function renameTeam(i) {
  const n = prompt('팀 이름 수정', teams[i].name);
  if (n) { teams[i].name = n; renderTeams(); }
}
function resetScores() { teams.forEach(t=>t.score=0); renderTeams(); }

// ── 편집 ──────────────────────────────────
function toggleEdit() {
  const ep = document.getElementById('editPanel');
  ep.classList.toggle('show');
  if (ep.classList.contains('show')) buildEditPanel();
}
function buildEditPanel() {
  document.getElementById('editTitle').value = pageTitle;
  document.getElementById('editDesc').value  = pageDesc;
  const ec = document.getElementById('editCards');
  ec.innerHTML = '';
  missions.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'edit-card';
    d.innerHTML = `
      <div class="edit-num">${m.num}</div>
      <div class="edit-fields">
        <input id="ev${i}" value="${m.value}" placeholder="제목">
        <textarea id="em${i}" placeholder="미션 내용">${m.mission}</textarea>
      </div>`;
    ec.appendChild(d);
  });
}
function addMission() {
  const num = missions.length + 1;
  missions.push({ num, value:'새 미션', category:'B', type:'목적', color:'#8E24AA', bg:'#F3E5F5', mission:'미션 내용을 입력하세요.', hint:'힌트를 입력하세요.' });
  buildEditPanel();
}
function saveEdit() {
  pageTitle = document.getElementById('editTitle').value || pageTitle;
  pageDesc  = document.getElementById('editDesc').value  || pageDesc;
  document.getElementById('pageTitle').textContent = pageTitle;
  document.getElementById('pageDesc').textContent  = pageDesc;
  missions.forEach((m, i) => {
    m.value   = document.getElementById('ev'+i).value;
    m.mission = document.getElementById('em'+i).value;
  });
  document.getElementById('editPanel').classList.remove('show');
  renderGrid();
}
function downloadHTML() {
  const mJSON = JSON.stringify(missions);
  const src = document.documentElement.outerHTML
    .replace(/let missions = \[[\s\S]*?\];/, `let missions = ${mJSON};`)
    .replace(/let pageTitle = '[^']*';/, `let pageTitle = '${pageTitle}';`)
    .replace(/let pageDesc  = '[^']*';/, `let pageDesc  = '${pageDesc}';`);
  const a = document.createElement('a');
  a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(src);
  a.download = '행복단원_미션보드.html';
  a.click();
}

// ── 초기화 ──────────────────────────────────
function resetAll() {
  if (!confirm('모든 완료 기록을 초기화할까요?')) return;
  done.clear(); renderGrid();
  document.getElementById('randomResult').classList.remove('show');
}

// ── 역전 타임 ──────────────────────────────────
let rTotal = 180, rLeft = 180, rRun = false, rIv = null;
let rAudioCtx = null;
let rMelodyIv = null;

// 긴박한 멜로디 음표 배열 (Hz, 박자ms)
const MELODY = [
  [659,120],[0,40],[659,120],[0,40],[659,120],[0,40],
  [523,120],[659,120],[784,200],[0,100],[392,200],[0,100],
  [523,160],[0,60],[392,160],[0,60],[330,160],[0,60],
  [440,120],[494,120],[466,80],[440,120],[0,40],
  [392,120],[659,120],[784,120],[880,120],[0,40],
  [698,120],[784,80],[0,40],[659,160],[0,60],
  [523,120],[587,120],[494,120],[0,40],
  [523,160],[392,160],[330,120],[0,80],
];
let mIdx = 0;

function getAudioCtx() {
  if (!rAudioCtx) rAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return rAudioCtx;
}

function playNote(freq, dur) {
  if (freq === 0) return;
  try {
    const ctx = getAudioCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur/1000 * 0.9);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + dur/1000);
  } catch(e){}
}

function tickMelody() {
  const [freq, dur] = MELODY[mIdx % MELODY.length];
  playNote(freq, dur);
  mIdx++;
  rMelodyIv = setTimeout(tickMelody, MELODY[(mIdx-1) % MELODY.length][1] + 20);
}

function adjustReversal(sec) {
  rLeft = Math.max(30, Math.min(rLeft + sec, 600));
  rTotal = rLeft;
  renderReversal();
}

function startReversal() {
  rLeft = rTotal; mIdx = 0; rRun = true;
  document.getElementById('reversalOverlay').classList.add('show');
  renderReversal();
  rIv = setInterval(() => {
    if (rLeft <= 0) { stopReversal(); playAlarm(); return; }
    rLeft--;
    renderReversal();
  }, 1000);
  tickMelody();
}

function stopReversal() {
  clearInterval(rIv); clearTimeout(rMelodyIv);
  rRun = false;
  document.getElementById('reversalOverlay').classList.remove('show');
}

function playAlarm() {
  const freqs = [880,0,880,0,880,0,1047,0,1047,0,1175];
  let t = 0;
  freqs.forEach((f,i) => {
    setTimeout(() => playNote(f, 180), t);
    t += 220;
  });
}

function renderReversal() {
  const m = String(Math.floor(rLeft/60)).padStart(2,'0');
  const s = String(rLeft%60).padStart(2,'0');
  const d = document.getElementById('reversalDisp');
  d.textContent = m + ':' + s;
  d.className = 'reversal-timer' + (rLeft <= 30 ? ' danger' : '');
  const pct = (rLeft / rTotal) * 100;
  document.getElementById('reversalProg').style.width = pct + '%';
}

// ── 초기 실행 ──────────────────────────────────
renderGrid();
renderTimer();
</script>
